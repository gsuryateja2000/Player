name: Build SPACEQ Player APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract SPACEQ Player ZIP
        run: |
          unzip -o SPACEQ-Pure-Player-2.6.1-AndroidX-Fix.zip
          echo "ZIP extracted"
          find . -maxdepth 3 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build SPACEQ Player APK
        working-directory: SPACEQPlayerAndroid
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPACEQ-Player-APK
          path: SPACEQPlayerAndroid/app/build/outputs/apk/debug/app-debug.apk
